name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onescm
          POSTGRES_PASSWORD: onescm
          POSTGRES_DB: onescm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onescm -d onescm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit- und API-Tests (SQLite + s3rver)
        run: npm test
      - name: MinIO starten (S3-Test gegen echten S3-kompatiblen Speicher)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=onescm -e MINIO_ROOT_PASSWORD=onescm-secret minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Unit- und API-Tests (PostgreSQL + MinIO)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://onescm:onescm@localhost:5432/onescm_test
          TEST_S3_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: onescm
          AWS_SECRET_ACCESS_KEY: onescm-secret
          AWS_REGION: us-east-1
      - name: Traceability prüfen (P0-Abdeckung, x-requirements)
        run: npm run traceability && git diff --exit-code docs/traceability.md
      - name: Build
        run: npm run build
      - name: Playwright installieren
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: E2E-Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.node }}
          path: e2e/test-results
