name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onescm
          POSTGRES_PASSWORD: onescm
          POSTGRES_DB: onescm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onescm -d onescm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Sicherheitsprüfung der Laufzeitabhängigkeiten
        run: npm audit --omit=dev --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit- und API-Tests (SQLite + s3rver)
        run: npm test
      - name: S3-Server starten (moto, S3-kompatibel)
        run: |
          python3 -m venv /tmp/moto && /tmp/moto/bin/pip install -q 'moto[server]'
          nohup /tmp/moto/bin/moto_server -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/moto-api/ > /dev/null && break; sleep 1; done
      - name: Unit- und API-Tests (PostgreSQL + moto-S3)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://onescm:onescm@localhost:5432/onescm_test
          TEST_S3_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: onescm
          AWS_SECRET_ACCESS_KEY: onescm-secret
          AWS_REGION: us-east-1
      - name: Traceability prüfen (P0-Abdeckung, x-requirements)
        run: npm run traceability && git diff --exit-code docs/traceability.md
      - name: Build
        run: npm run build
      - name: Playwright installieren
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: E2E-Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.node }}
          path: e2e/test-results

  helm:
    name: Helm-Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Chart prüfen und mit mehreren Wertesätzen rendern
        run: |
          helm lint --strict deploy/helm/onescm
          helm template t deploy/helm/onescm --kube-version 1.30 > /tmp/default.yaml
          helm template t deploy/helm/onescm --kube-version 1.30 --set ingress.enabled=true,ingress.tls.enabled=true,api.autoscaling.enabled=true,tracing.enabled=true,metrics.serviceMonitor.enabled=true,worker.enabled=false,extraEnv.OIDC_ISSUER=https://idp.example.org > /tmp/full.yaml
          python3 -c "import sys, yaml; [print(f, len([d for d in yaml.safe_load_all(open(f)) if d])) for f in sys.argv[1:]]" /tmp/default.yaml /tmp/full.yaml

  release:
    name: Release-Pipeline prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versionen konsistent, CHANGELOG-Abschnitt vorhanden
        run: npm run -s release -- check
      - name: Workflows prüfen (actionlint)
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Container-Image bauen und starten (Smoke-Test)
        run: |
          docker build --build-arg APP_VERSION=ci-${GITHUB_SHA::7} -t onescm:ci .
          docker run -d --name smoke -p 3000:3000 onescm:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/v1/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/api/v1/health | tee /tmp/health.json
          grep -q "\"version\":\"ci-${GITHUB_SHA::7}\"" /tmp/health.json
          curl -sf http://localhost:3000/help/widget.js | grep -q OneScmHelp
          docker rm -f smoke
