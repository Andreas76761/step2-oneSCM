name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit- und API-Tests
        run: npm test
      - name: Traceability prüfen (P0-Abdeckung, x-requirements)
        run: npm run traceability && git diff --exit-code docs/traceability.md
      - name: Build
        run: npm run build
      - name: Playwright installieren
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: E2E-Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.node }}
          path: e2e/test-results
