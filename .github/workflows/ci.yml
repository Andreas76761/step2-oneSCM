name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onescm
          POSTGRES_PASSWORD: onescm
          POSTGRES_DB: onescm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onescm -d onescm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit- und API-Tests (SQLite)
        run: npm test
      - name: Unit- und API-Tests (PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://onescm:onescm@localhost:5432/onescm_test
      - name: Traceability prüfen (P0-Abdeckung, x-requirements)
        run: npm run traceability && git diff --exit-code docs/traceability.md
      - name: Build
        run: npm run build
      - name: Playwright installieren
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: E2E-Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.node }}
          path: e2e/test-results
