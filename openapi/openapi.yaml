openapi: 3.1.1
info:
  title: oneSCM Handbook Studio API
  version: 0.24.0
  description: |
    Revisionssichere Erstellung rollen- und spartenspezifischer Benutzerhandbücher aus Markdown-Quellen.
    Jede Operation referenziert über `x-requirements` die zugehörigen User Stories (US-020).
    Operationen mit `x-extension: true` ergänzen die verbindliche Operationsliste aus Masterprompt §10 (siehe docs/01-gap-analyse.md, Lücke 10).
    Fehler werden als `application/problem+json` (RFC 9457) geliefert.
    Authentifizierung (ENTSCHEIDUNG E-15), je nach Betriebsart (`GET /auth/config`):
    - `oidc`: `Authorization: Bearer <JWT>` eines OpenID-Connect-Providers; technische Berechtigungen aus einem Gruppen-/Rollen-Claim.
    - `demo`: Header `X-User-Id` mit einem Demo-Benutzer; ohne Header nur Lesezugriff. Nur für Entwicklung und Demo.
    Projekt (ADR-014): Header `X-Project-Id` wählt das Projekt aller projektbezogenen Endpunkte (Standard `p_default`);
    IDs anderer Projekte werden wie nicht vorhandene behandelt (404). Ausnahmen: `/projects…` und die Health-Checks.
    Betrieb (ADR-015, ADR-027): jede Antwort trägt `X-Request-Id` (bei aktivem Tracing zusätzlich `X-Trace-Id`, W3C `traceparent` wird übernommen);
    Rate-Limits je Benutzer und Minute (429 mit `Retry-After`), mit `RATE_LIMIT_STORE=db` gemeinsam über alle Instanzen;
    Prometheus-Metriken unter `/metrics` (außerhalb von `/api/v1`, Bearer `METRICS_TOKEN` oder Berechtigung admin).
servers:
  - url: /api/v1
tags:
  - name: Import
  - name: Snippets
  - name: Qualität
  - name: Kapitel
  - name: Kapitelwerkstatt
  - name: Freigabe
  - name: Export
  - name: Traceability
  - name: KI-Umformulierung
  - name: Projekte
  - name: Suche
  - name: Veröffentlichung
  - name: Kollaboration
  - name: Übersetzung
  - name: Quellverbindungen
  - name: Analytik
  - name: Assistent
  - name: Integrationen
  - name: Medien
  - name: Kontexthilfe
  - name: Stammdaten
  - name: Draft Manual
  - name: Suche
  - name: Schreibstil
  - name: Bilder
  - name: System
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-Token des konfigurierten OIDC-Providers (AUTH_MODE=oidc)
    demoUser:
      type: apiKey
      in: header
      name: X-User-Id
  parameters:
    ImportId: { name: importId, in: path, required: true, schema: { type: string } }
    SnippetId: { name: snippetId, in: path, required: true, schema: { type: string } }
    FindingId: { name: findingId, in: path, required: true, schema: { type: string } }
    ChapterId: { name: chapterId, in: path, required: true, schema: { type: string } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string } }
    BlockId: { name: blockId, in: path, required: true, schema: { type: string } }
    ClusterId: { name: clusterId, in: path, required: true, schema: { type: string } }
    ProposalId: { name: proposalId, in: path, required: true, schema: { type: string } }
    BatchId: { name: batchId, in: path, required: true, schema: { type: string } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string } }
    ReleaseId: { name: releaseId, in: path, required: true, schema: { type: string } }
    ConnectionId: { name: connectionId, in: path, required: true, schema: { type: string } }
    WebhookId: { name: webhookId, in: path, required: true, schema: { type: string } }
    HelpContextId: { name: helpContextId, in: path, required: true, schema: { type: string } }
    OutlineId: { name: outlineId, in: path, required: true, schema: { type: string } }
    NodeId: { name: nodeId, in: path, required: true, schema: { type: string } }
    ContextKey: { name: contextKey, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9._:-]{0,79}$' }, description: 'Kontext-ID aus oneSCM, z. B. order.create' }
    HelpRole: { name: role, in: query, schema: { type: string }, description: Rollencode (Inhalte der Rolle und allgemeine Inhalte) }
    HelpDivision: { name: division, in: query, schema: { type: string }, description: Spartencode }
    HelpLanguage: { name: language, in: query, schema: { type: string }, description: 'Zielsprache des Projekts; ohne freigegebene Übersetzung Rückfall auf Deutsch' }
    From: { name: from, in: query, schema: { type: string, format: date }, description: 'Beginn (JJJJ-MM-TT, Standard: 89 Tage vor Ende)' }
    To: { name: to, in: query, schema: { type: string, format: date }, description: 'Ende (JJJJ-MM-TT, Standard: heute)' }
    CommentId: { name: commentId, in: path, required: true, schema: { type: string } }
    TranslationId: { name: translationId, in: path, required: true, schema: { type: string } }
    TranslationBlockId: { name: translationBlockId, in: path, required: true, schema: { type: string } }
    UserId: { name: userId, in: path, required: true, schema: { type: string }, description: Demo-Benutzer oder OIDC-Identität (oidc:<sub>) }
  responses:
    TooManyRequests:
      description: Rate-Limit je Benutzer und Minute überschritten (ADR-015); Header Retry-After
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Nicht angemeldet oder Token ungültig
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: Fehler (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        visibility: { type: string, enum: [open, restricted] }
        archivedAt: { type: [string, 'null'] }
        myPermissions: { type: array, items: { type: string } }
        chapters: { type: integer }
        sources: { type: integer }
    ProjectMember:
      type: object
      properties:
        userId: { type: string }
        name: { type: [string, 'null'] }
        permissions: { type: array, items: { type: string, enum: [read, edit, decide, approve, admin] } }
        addedBy: { type: string }
        addedAt: { type: string }
    RewriteBatch:
      type: object
      description: KI-Umformulierung eines ganzen Kapitels als Hintergrundjob
      properties:
        id: { type: string }
        chapterVersionId: { type: string }
        status: { type: string, enum: [queued, processing, completed, cancelled, failed] }
        instructions: { type: [string, 'null'] }
        total: { type: integer }
        done: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cancelRequested: { type: boolean }
        error: { type: [string, 'null'] }
    RewriteProposal:
      type: object
      description: KI-Umformulierungsvorschlag mit Prüfergebnis je Satz (ADR-013, Entscheidung E-16)
      properties:
        id: { type: string }
        blockId: { type: string }
        blockVersionNo: { type: integer, description: Blockversion, auf die sich der Vorschlag bezieht }
        provider: { type: string, enum: [anthropic, openai, demo] }
        model: { type: string }
        promptHash: { type: string, description: SHA-256 der übertragenen Anfrage }
        sentSnippetIds: { type: array, items: { type: string }, description: an den KI-Dienst übertragene Textabschnitte }
        originalText: { type: string }
        proposedText: { type: string }
        valid: { type: boolean, description: jeder Satz belegt und geprüft }
        status: { type: string, enum: [proposed, invalid, accepted, rejected, stale] }
        sentences:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              sourceLabels: { type: array, items: { type: string } }
              sourceIds: { type: array, items: { type: string } }
              support: { type: number, description: Anteil der durch die Quellen gedeckten Inhaltswörter }
              issues: { type: array, items: { type: string, enum: [no_sources, unknown_source, new_numbers, low_support, privacy, empty] } }
              details: { type: array, items: { type: string } }
        usage: { type: [object, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'] }
        decisionReason: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        gate: { $ref: '#/components/schemas/GateResult' }
        blockers: { type: array, items: { type: object } }
    RoleCode: { type: string, enum: [dealer, market, mo, hq, all] }
    DivisionCode: { type: string, enum: [car, van, truck, bus, all, unconfirmed] }
    EvidenceStatus: { type: string, enum: [source_confirmed, manually_confirmed, unconfirmed, open_question] }
    Assignment:
      type: object
      properties:
        code: { type: string }
        score: { type: number }
        method: { type: string }
        modelVersion: { type: string }
        evidenceStatus: { $ref: '#/components/schemas/EvidenceStatus' }
        evidence: { type: [string, 'null'] }
    Import:
      type: object
      properties:
        id: { type: string }
        fileName: { type: string }
        kind: { type: string, enum: [zip, md] }
        sha256: { type: string }
        byteSize: { type: integer }
        status: { type: string, enum: [queued, processing, completed, completed_with_errors, failed] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        stats: { type: object }
        items:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              sha256: { type: [string, 'null'] }
              status: { type: string, enum: [imported, identical, failed, skipped] }
              message: { type: [string, 'null'] }
              revisionId: { type: [string, 'null'] }
    Snippet:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer }
        text: { type: string, description: Unveränderlicher Ursprungstext }
        kind: { type: string, enum: [paragraph, list, ordered_list, table, code, quote] }
        chapter: { type: object, properties: { id: { type: string }, title: { type: string } } }
        subchapter: { type: [object, 'null'] }
        headingPath: { type: array, items: { type: string } }
        lineStart: { type: integer }
        lineEnd: { type: integer }
        evidenceStatus: { $ref: '#/components/schemas/EvidenceStatus' }
        market: { type: [string, 'null'] }
        release: { type: [string, 'null'] }
        scopeStatus: { type: string }
        excludedReason: { type: [string, 'null'] }
        source: { type: object }
        roles: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        divisions: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    SnippetPatch:
      type: object
      description: Ändert ausschließlich Klassifikation und Evidenzstatus, nie den Ursprungstext.
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
        divisions: { type: array, items: { $ref: '#/components/schemas/DivisionCode' } }
        confirmRoles: { type: boolean }
        confirmDivisions: { type: boolean }
        evidenceStatus: { $ref: '#/components/schemas/EvidenceStatus' }
        market: { type: [string, 'null'] }
        release: { type: [string, 'null'] }
        confirmScope: { type: boolean }
        note: { type: [string, 'null'] }
    Finding:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer }
        type: { type: string, enum: [gap, duplicate, contradiction, terminology, privacy, readability] }
        subtype: { type: string }
        severity: { type: string, enum: [blocker, high, medium, low] }
        status: { type: string, enum: [open, deferred, resolved, ignored, obsolete] }
        score: { type: [number, 'null'] }
        method: { type: string }
        reason: { type: string }
        details: { type: object }
        decision: { type: [string, 'null'] }
        decisionReason: { type: [string, 'null'] }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'] }
        a: { type: [object, 'null'] }
        b: { type: [object, 'null'] }
    Decision:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [take_a, take_b, conditional, role_difference, division_difference, market_difference, release_difference, outdated_source, ignore, defer]
        reason: { type: string, minLength: 3 }
        outdated: { type: string, enum: [a, b] }
    ContentBlock:
      type: object
      properties:
        id: { type: string }
        lineageId: { type: string }
        section: { type: string }
        position: { type: integer }
        kind: { type: string, enum: [paragraph, list, note, tip, warning, xref, gap, table, code] }
        text: { type: string }
        mode: { type: string, enum: [generated, manually_edited, locked, needs_regeneration, ai_rewritten, approved] }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
        divisions: { type: array, items: { $ref: '#/components/schemas/DivisionCode' } }
        market: { type: [string, 'null'] }
        release: { type: [string, 'null'] }
        scopeStatus: { type: string, enum: [confirmed, general, unconfirmed] }
        justification: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        versionNo: { type: integer }
        sources: { type: array, items: { type: object } }
        sentences:
          description: Satz-Evidenz eines übernommenen KI-Vorschlags (ADR-013); null, wenn nicht KI-umformuliert
          type: [array, 'null']
          items: { type: object, properties: { text: { type: string }, sourceIds: { type: array, items: { type: string } } } }
    BlockPatch:
      type: object
      properties:
        text: { type: string }
        section: { type: string }
        position: { type: integer }
        kind: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
        divisions: { type: array, items: { $ref: '#/components/schemas/DivisionCode' } }
        market: { type: [string, 'null'] }
        release: { type: [string, 'null'] }
        scopeStatus: { type: string, enum: [confirmed, general, unconfirmed] }
        justification: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        mode: { type: string, enum: [locked, manually_edited] }
        sourceIds: { type: array, items: { type: string } }
        reason: { type: string }
        expectedVersionNo: { type: integer, description: Optimistische Sperre }
    ChapterVersion:
      type: object
      properties:
        id: { type: string }
        chapterId: { type: string }
        versionNo: { type: integer }
        status: { type: string, enum: [draft, in_review, approved, superseded] }
        submittedBy: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'] }
        submitComment: { type: [string, 'null'] }
        sections:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              title: { type: string }
              blocks: { type: array, items: { $ref: '#/components/schemas/ContentBlock' } }
        approvals: { type: array, items: { type: object } }
    GateResult:
      type: object
      properties:
        passed: { type: boolean }
        checks:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              passed: { type: boolean }
              details: { type: array, items: { type: string } }
    ExportRequest:
      type: object
      properties:
        chapterIds: { type: array, items: { type: string } }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
        divisions: { type: array, items: { $ref: '#/components/schemas/DivisionCode' } }
        market: { type: [string, 'null'] }
        release: { type: [string, 'null'] }
        format: { type: string, enum: [md, html, pdf, docx, json], default: md, description: 'docx: Word mit Formatvorlagen und Firmen-Layout (ADR-038)' }
        outlineId: { type: string, description: 'Handbuch-Variante (ADR-034): freigegebene Kapitel dieser Gliederung, Filter aus ihrer Variante' }
        appendices: { type: boolean, description: 'Verzeichnisse (Abkürzungen, Glossar, Bildverzeichnis, FAQ) anhängen; Standard bei Varianten: true' }
security:
  - oidcBearer: []
  - demoUser: []
paths:
  /imports:
    post:
      operationId: createImport
      summary: ZIP-, Markdown-, HTML- (Confluence-Export) oder Word-Datei importieren (HTML/Word werden in Markdown umgewandelt, ADR-022)
      tags: [Import]
      x-requirements: [US-001, US-002, US-003, US-004, NFR-09, NFR-14, NFR-23]
      parameters:
        - { name: snapshot, in: query, schema: { type: boolean }, description: 'ZIP ist der vollständige Stand – fehlende Dateien derselben Herkunft werden als entfernt markiert (ADR-036)' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Import angenommen, Verarbeitung im Hintergrund
          content: { application/json: { schema: { $ref: '#/components/schemas/Import' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listImports
      summary: Importe auflisten
      tags: [Import]
      x-requirements: [US-001]
      x-extension: true
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: 'Liste, content: { application/json: { schema: { type: array, items: { $ref: ''#/components/schemas/Import'' } } } }' }
  /imports/{importId}:
    get:
      operationId: getImport
      summary: Importstatus und Protokoll je Datei
      tags: [Import]
      x-requirements: [US-001]
      parameters: [{ $ref: '#/components/parameters/ImportId' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: 'Import, content: { application/json: { schema: { $ref: ''#/components/schemas/Import'' } } }' }
        '404': { $ref: '#/components/responses/Problem' }
  /sources:
    get:
      operationId: listSources
      summary: Quelldokumente mit Revisionen (removedAt – als entfernt markiert, ADR-036)
      tags: [Import]
      x-requirements: [US-001, US-011]
      x-extension: true
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Quellen }
  /source-documents/{documentId}/restore:
    post:
      operationId: restoreSourceDocument
      summary: 'Als entfernt markiertes Quelldokument wiederherstellen (letzte Revision wird wieder aktuell)'
      tags: [Import]
      x-requirements: [NFR-23]
      x-extension: true
      parameters: [{ name: documentId, in: path, required: true, schema: { type: string } }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: 'Quelldokument' }
        '409': { description: 'nicht als entfernt markiert' }
  /source-revisions/{revisionId}/raw:
    get:
      operationId: getRevisionRaw
      summary: Unveränderten Ursprungstext einer Revision als text/plain abrufen
      tags: [Import]
      x-requirements: [US-001, US-011]
      x-extension: true
      parameters: [{ name: revisionId, in: path, required: true, schema: { type: string } }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: 'Rohtext, content: { text/plain: { schema: { type: string } } }' }
        '404': { $ref: '#/components/responses/Problem' }
  /source-revisions/{revisionId}/original:
    get:
      operationId: getRevisionOriginal
      summary: Originaldatei einer umgewandelten Revision (HTML als text/plain, Word als .docx; ADR-022)
      tags: [Import]
      x-requirements: [NFR-09, US-001]
      x-extension: true
      parameters: [{ name: revisionId, in: path, required: true, schema: { type: string } }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Originaldatei }
        '404': { description: Revision unbekannt oder Markdown-Quelle ohne Original }
  /source-connections:
    get:
      operationId: listSourceConnections
      summary: Git-Quellverbindungen des Projekts mit Stand des letzten Abgleichs
      tags: [Quellverbindungen]
      x-requirements: [NFR-09]
      x-extension: true
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: OK }
    post:
      operationId: createSourceConnection
      summary: Git-Repository oder Confluence-Cloud-Bereich verbinden und sofort abgleichen (Berechtigung admin; nur https, Zugangsdaten nur über Umgebungsvariablen GIT_CREDENTIAL_* bzw. CONFLUENCE_CREDENTIAL_*). Git-Verbindungen erhalten ein Push-Webhook-Geheimnis (nur in dieser Antwort)
      tags: [Quellverbindungen]
      x-requirements: [NFR-09, NFR-15]
      x-extension: true
      requestBody:
        content: { application/json: { schema: { type: object, required: [name, url], properties: { kind: { type: string, enum: [git, confluence], default: git }, name: { type: string, maxLength: 120 }, url: { type: string }, branch: { type: [string, 'null'] }, subPath: { type: string }, spaceKey: { type: string, description: 'Confluence-Bereichsschlüssel (Pflicht bei kind=confluence)' }, credentialEnv: { type: [string, 'null'], pattern: '^(GIT|CONFLUENCE)_CREDENTIAL_[A-Z0-9_]+$' }, intervalMinutes: { type: integer, description: '0 = nur manuell, sonst 5 … 10080' } } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201': { description: Angelegt, Abgleich eingeplant }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /source-connections/{connectionId}:
    get:
      operationId: getSourceConnection
      summary: Quellverbindung mit Status, letztem Commit, Fehler und nächstem Abgleich
      tags: [Quellverbindungen]
      x-requirements: [NFR-09]
      x-extension: true
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSourceConnection
      summary: Quellverbindung ändern; neues Intervall plant den nächsten Abgleich neu (Berechtigung admin)
      tags: [Quellverbindungen]
      x-requirements: [NFR-09]
      x-extension: true
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, url: { type: string }, branch: { type: [string, 'null'] }, subPath: { type: string }, credentialEnv: { type: [string, 'null'] }, intervalMinutes: { type: integer } } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSourceConnection
      summary: Quellverbindung entfernen (Importe und Revisionen bleiben erhalten; Berechtigung admin)
      tags: [Quellverbindungen]
      x-requirements: [NFR-09]
      x-extension: true
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204': { description: Entfernt }
