apiVersion: v1
kind: Service
metadata:
  name: {{ include "onescm.fullname" . }}
  labels:
    {{- include "onescm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "onescm.selector" (dict "root" . "component" "api") | nindent 4 }}
