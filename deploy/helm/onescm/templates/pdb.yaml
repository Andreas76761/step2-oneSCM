{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "onescm.fullname" . }}-api
  labels:
    {{- include "onescm.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "onescm.selector" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
