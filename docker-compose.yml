# Produktionsnahes Setup: App + PostgreSQL. Für OIDC AUTH_MODE=oidc und OIDC_* setzen (siehe README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: onescm
      POSTGRES_USER: onescm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onescm-change-me}
    volumes:
      - onescm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onescm -d onescm"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://onescm:${POSTGRES_PASSWORD:-onescm-change-me}@db:5432/onescm
      AUTH_MODE: ${AUTH_MODE:-demo}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_PERMISSIONS_CLAIM: ${OIDC_PERMISSIONS_CLAIM:-roles}
      # Für mehrere Instanzen: OBJECT_STORE=s3 mit S3_BUCKET (und S3_ENDPOINT für S3-kompatible Speicher), siehe README.
      # Zugangsdaten: AWS_* aus der Host-Umgebung; leer lassen, um die Instanzrolle zu nutzen.
      OBJECT_STORE: ${OBJECT_STORE:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # KI-Umformulierung (ADR-013): standardmäßig aus; anthropic | openai | demo
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Betrieb (ADR-015): Metriken unter /metrics mit Bearer-Token, Rate-Limits je Benutzer und Minute
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1200}
      RATE_LIMIT_EXPENSIVE_MAX: ${RATE_LIMIT_EXPENSIVE_MAX:-60}
      UPLOAD_MAX_BYTES: 52428800
      ZIP_MAX_FILES: 5000
    volumes:
      - onescm-data:/data
volumes:
  onescm-db:
  onescm-data:
